name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cotisations_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cotisations_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cotisations_db?schema=public
      JWT_SECRET: ci-super-secret-jwt-key-1234567890
      JWT_REFRESH_SECRET: ci-super-secret-refresh-key-1234567890
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Prisma generate
        run: npm run prisma:generate
        working-directory: backend

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Unit tests
        run: npm test -- --runInBand
        working-directory: backend

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000/api
        run: npm run build
        working-directory: frontend
